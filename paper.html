<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paper · Harness Papers Daily</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--panel2:#0f141b;--border:#30363d;--fg:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--green:#3fb950;--purple:#d2a8ff}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;line-height:1.72}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}.wrap{max-width:1260px;margin:0 auto;padding:0 24px 72px}
header.site{padding:30px 0 20px;border-bottom:1px solid var(--border);margin-bottom:24px}.brand{color:var(--muted);font-size:13px;font-weight:750;letter-spacing:.12em;text-transform:uppercase}
h1{font-size:clamp(28px,4vw,42px);line-height:1.15;margin:10px 0 12px;max-width:28ch}.meta,.muted{color:var(--muted);font-size:14px}
.badge{display:inline-block;border:1px solid var(--border);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:750}.badge.rel5{color:#f778ba;border-color:#f778ba55}.badge.rel4{color:#ffa657;border-color:#ffa65755}
.reader-guide{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 0}.reader-guide span{font-size:12px;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:4px 9px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:28px;align-items:start}.reader{min-width:0;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:clamp(22px,4vw,38px)}
.reader h2{scroll-margin-top:20px;margin:46px 0 14px;font-size:25px;line-height:1.25;padding-bottom:9px;border-bottom:1px solid var(--border)}.reader h2:first-child{margin-top:0;color:var(--green);font-size:27px;border-bottom-color:#3fb95055}
.reader h3{scroll-margin-top:20px;margin:30px 0 10px;font-size:18px;color:var(--accent)}.reader p{max-width:84ch;margin:12px 0}.reader li{margin:6px 0}.reader strong{color:#fff}
.reader blockquote{margin:18px 0;padding:2px 0 2px 18px;border-left:3px solid var(--purple);color:#c9d1d9}.reader code{background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:1px 6px}
.table-wrap{overflow-x:auto;margin:18px 0;border:1px solid var(--border);border-radius:10px}table{width:100%;border-collapse:collapse;font-size:14px;min-width:600px}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top}th{background:var(--panel2)}tr:last-child td{border-bottom:0}
.mermaid{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:20px;margin:20px 0;overflow:auto}.mermaid svg{min-width:720px;max-width:none!important;height:auto}
.toc{position:sticky;top:18px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 14px;max-height:calc(100vh - 36px);overflow:auto}.toc-title{font-weight:800;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}.toc a{display:block;padding:6px 8px;border-radius:7px;color:#c9d1d9;font-size:13px;line-height:1.35}.toc a:hover{background:var(--panel2);text-decoration:none;color:var(--fg)}
.nav{display:flex;justify-content:space-between;gap:16px;margin-top:28px;padding-top:18px;border-top:1px solid var(--border)}footer{margin-top:48px;padding-top:16px;border-top:1px solid var(--border);color:var(--muted);font-size:13px}
@media(max-width:900px){.layout{grid-template-columns:1fr}.toc{position:relative;top:auto;max-height:none;order:-1}.mermaid svg{min-width:620px}}@media(max-width:650px){.wrap{padding:0 14px 50px}.reader{padding:19px}.nav{flex-direction:column}.mermaid svg{min-width:560px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script type="module">import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";window.__mermaid=mermaid;</script>
</head><body><div class="wrap"><header class="site"><div class="brand"><a href="index.html" style="color:inherit">Harness Papers Daily</a></div>
<h1 id="title">Loading paper…</h1><div id="meta" class="meta"></div><div class="reader-guide"><span>1 · True novelty</span><span>2 · Exact loop</span><span>3 · Implementation</span><span>4 · Experiments + ablations</span><span>5 · RHEvolution use</span></div></header>
<div class="layout"><main id="reader" class="reader"></main><aside id="toc" class="toc"><div class="toc-title">On this page</div></aside></div><div id="nav" class="nav"></div>
<footer>Implementation-oriented notes for RHEvolution. Numbers are reported from the linked paper; interpretation is separated from evidence.</footer></div>
<script src="papers-data.js"></script><script>
(async function(){const q=new URLSearchParams(location.search),id=q.get("id"),papers=window.PAPERS||[],i=papers.findIndex(p=>p.id===id),p=papers[i];if(!p){document.getElementById("title").textContent="Paper not found";document.getElementById("reader").innerHTML="<p>This paper is not in the published set.</p>";return}
document.getElementById("title").textContent=p.title;document.title=p.title+" · Harness Papers Daily";const rawUrl="https://raw.githubusercontent.com/ShadowKingYT444/harness-papers-daily/main/_analyses/"+p.id+".md";
try{const raw=await fetch(rawUrl).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.text()}),m=raw.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/),fm={},body=m?m[2]:raw;if(m){m[1].split("\n").forEach(line=>{const k=line.indexOf(":");if(k>0)fm[line.slice(0,k).trim()]=line.slice(k+1).trim().replace(/^"|"$/g,"")})}
const label=p.relevance===5?"core mechanism":"highly relevant";document.getElementById("meta").innerHTML="Day "+p.day+" · "+(fm.published?"published "+fm.published+" · ":"")+"<span class='badge rel"+p.relevance+"'>"+label+"</span> · <a href='"+(fm.arxiv_url||"https://arxiv.org/abs/"+p.id)+"' target='_blank' rel='noopener'>Open paper ↗</a>";
const reader=document.getElementById("reader");reader.innerHTML=marked.parse(body);reader.querySelectorAll("pre code.language-mermaid").forEach(code=>{const div=document.createElement("div");div.className="mermaid";div.textContent=code.textContent;code.parentElement.replaceWith(div)});reader.querySelectorAll("table").forEach(t=>{const w=document.createElement("div");w.className="table-wrap";t.parentNode.insertBefore(w,t);w.appendChild(t)});
const used=new Set(),slug=s=>{let x=s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"section",base=x,n=2;while(used.has(x))x=base+"-"+n++;used.add(x);return x},hs=[...reader.querySelectorAll("h2")];hs.forEach(h=>h.id=slug(h.textContent));document.getElementById("toc").innerHTML="<div class='toc-title'>On this page</div>"+hs.map(h=>"<a href='#"+h.id+"'>"+h.textContent+"</a>").join("");
const prev=papers[i-1],next=papers[i+1];document.getElementById("nav").innerHTML="<span>"+(prev?"<a href='paper.html?id="+prev.id+"'>← Day "+prev.day+": "+prev.title+"</a>":"")+"</span><span><a href='index.html'>All papers</a></span><span>"+(next?"<a href='paper.html?id="+next.id+"'>Day "+next.day+": "+next.title+" →</a>":"")+"</span>";
function render(){if(!window.__mermaid)return setTimeout(render,30);window.__mermaid.initialize({startOnLoad:false,theme:"dark",securityLevel:"strict",flowchart:{htmlLabels:true,curve:"basis"}});window.__mermaid.run({querySelector:".mermaid"})}render()}catch(e){document.getElementById("reader").innerHTML="<p>Could not load the paper note from GitHub.</p>"}})();
</script></body></html>
