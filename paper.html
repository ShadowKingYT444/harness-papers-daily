<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paper · Harness Papers Daily</title><style>:root{--bg:#0d1117;--panel:#161b22;--panel2:#0f141b;--border:#30363d;--fg:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--green:#3fb950}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;line-height:1.68}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}.wrap{max-width:940px;margin:0 auto;padding:0 22px 64px}header.site{padding:28px 0 18px;border-bottom:1px solid var(--border);margin-bottom:26px}.brand{color:var(--muted);font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}h1{font-size:32px;line-height:1.2;margin:8px 0}h2{margin-top:34px;font-size:22px;padding-bottom:8px;border-bottom:1px solid var(--border)}h3{font-size:17px;margin-top:26px;color:var(--accent)}p{max-width:78ch}.meta,.muted{color:var(--muted);font-size:14px}.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px 22px;margin:16px 0}.card.core{border-color:#f778ba55}.card.high{border-color:#ffa65755}.badge{display:inline-block;border:1px solid var(--border);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;margin-right:8px}.badge.rel5{color:#f778ba;border-color:#f778ba55}.badge.rel4{color:#ffa657;border-color:#ffa65755}.kicker{color:var(--green);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--border);vertical-align:top}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.grid .card{margin:0}.grid h3{margin:0 0 8px;color:var(--fg)}.reader{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:24px}.reader li{margin:6px 0}.reader code{background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:1px 6px}.mermaid{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:16px;margin:18px 0;overflow-x:auto}.nav{display:flex;justify-content:space-between;gap:16px;margin-top:28px;padding-top:18px;border-top:1px solid var(--border)}footer{margin-top:48px;padding-top:16px;border-top:1px solid var(--border);color:var(--muted);font-size:13px}@media(max-width:700px){th.datecol,td.datecol{display:none}th,td{padding:8px 6px}.nav{flex-direction:column}}</style><script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script><script type="module">import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";window.__mermaid=mermaid;</script></head><body><div class="wrap"><header class="site"><div class="brand"><a href="index.html" style="color:inherit">Harness Papers Daily</a></div><h1 id="title">Loading paper…</h1><div id="meta" class="meta"></div></header><div id="reader" class="reader"></div><div id="nav" class="nav"></div><footer>Focused study notes for RHEvolution. Paper links point to arXiv.</footer></div><script src="papers-data.js"></script><script>
(async function(){const q=new URLSearchParams(location.search),id=q.get("id"),papers=window.PAPERS||[],i=papers.findIndex(p=>p.id===id),p=papers[i];if(!p){document.getElementById("title").textContent="Paper not found";document.getElementById("reader").innerHTML="<p>This paper is not in the core/high-relevance published set.</p>";return;}document.getElementById("title").textContent=p.title;document.title=p.title+" · Harness Papers Daily";const rawUrl="https://raw.githubusercontent.com/ShadowKingYT444/harness-papers-daily/main/_analyses/"+p.id+".md";try{const raw=await fetch(rawUrl).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.text()});const m=raw.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/),fm={},body=m?m[2]:raw;if(m){m[1].split("\n").forEach(line=>{const k=line.indexOf(":");if(k>0)fm[line.slice(0,k).trim()]=line.slice(k+1).trim().replace(/^"|"$/g,"")})}const label=p.relevance===5?"core mechanism":"highly relevant";document.getElementById("meta").innerHTML="Day "+p.day+" · "+(fm.published?"published "+fm.published+" · ":"")+"<span class='badge rel"+p.relevance+"'>"+label+"</span> · <a href='"+(fm.arxiv_url||"https://arxiv.org/abs/"+p.id)+"'>arXiv:"+p.id+"</a>";document.getElementById("reader").innerHTML=marked.parse(body);document.querySelectorAll("pre code.language-mermaid").forEach(code=>{const div=document.createElement("div");div.className="mermaid";div.textContent=code.textContent;code.parentElement.replaceWith(div)});const prev=papers[i-1],next=papers[i+1];document.getElementById("nav").innerHTML="<span>"+(prev?"<a href='paper.html?id="+prev.id+"'>← Day "+prev.day+": "+prev.title+"</a>":"")+"</span><span><a href='index.html'>All papers</a></span><span>"+(next?"<a href='paper.html?id="+next.id+"'>Day "+next.day+": "+next.title+" →</a>":"")+"</span>";function render(){if(!window.__mermaid)return setTimeout(render,30);window.__mermaid.initialize({startOnLoad:false,theme:"dark",securityLevel:"strict"});window.__mermaid.run({querySelector:".mermaid"})}render()}catch(e){document.getElementById("reader").innerHTML="<p>Could not load the paper note from GitHub.</p>"}})();
</script></body></html>
